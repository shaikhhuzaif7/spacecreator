<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SpaceCreator - CapCut & VN Studio</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&family=Poppins:wght@500;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background: #000000; color: #ffffff; height: 100vh; display: flex; flex-direction: column; overflow: hidden; user-select: none; }

    /* Top App Bar */
    .top-bar { height: 48px; background: #121212; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; border-bottom: 1px solid #222; }
    .brand-logo { font-size: 15px; font-weight: 800; color: #00f2fe; display: flex; align-items: center; gap: 6px; }
    .btn-export { background: linear-gradient(135deg, #00f2fe, #4facfe); color: #000; border: none; padding: 6px 14px; border-radius: 20px; font-weight: 700; font-size: 12px; cursor: pointer; }

    /* Video Player Viewport */
    .viewport { flex: 1; display: flex; align-items: center; justify-content: center; position: relative; background: #050505; overflow: hidden; }
    video { max-width: 100%; max-height: 100%; object-fit: contain; border-radius: 4px; }
    .upload-overlay { position: absolute; display: flex; flex-direction: column; align-items: center; gap: 10px; z-index: 10; }
    .btn-upload-big { background: #1e1e1e; border: 1px dashed #4facfe; color: #fff; padding: 14px 22px; border-radius: 14px; font-size: 13px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 8px; }

    /* On-Screen Overlay Text (Subtitles/Watermark) */
    #overlayText { position: absolute; font-family: 'Montserrat', sans-serif; font-size: 26px; font-weight: 900; color: #fff; text-shadow: 2px 2px 8px rgba(0,0,0,0.9); pointer-events: none; z-index: 5; text-align: center; }

    /* Playback Floating Controls */
    .play-control-bar { height: 40px; background: #121212; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; border-top: 1px solid #1a1a1a; }
    .time-badge { font-size: 11px; color: #888; font-family: monospace; font-weight: 700; }
    .btn-play-pause { background: none; border: none; color: #fff; font-size: 18px; cursor: pointer; }

    /* CapCut / VN Style Timeline */
    .timeline-container { height: 85px; background: #181818; display: flex; flex-direction: column; justify-content: center; padding: 8px 14px; position: relative; border-top: 1px solid #222; }
    .playhead-scrubber { width: 100%; accent-color: #00f2fe; cursor: pointer; height: 6px; }
    .track-strip { height: 42px; background: #262626; border-radius: 6px; border: 1px solid #333; margin-top: 6px; display: flex; align-items: center; padding: 0 10px; overflow: hidden; position: relative; }
    .track-strip span { font-size: 11px; color: #aaa; font-weight: 600; }

    /* Action Sub-Toolbars (Dynamic Drawer) */
    .tool-drawer { display: none; background: #1c1c1e; padding: 10px 14px; border-top: 1px solid #2c2c2e; overflow-x: auto; white-space: nowrap; gap: 8px; }
    .tool-drawer.active { display: flex; }
    .drawer-item { background: #2c2c2e; border: 1px solid #3a3a3c; color: #fff; padding: 6px 12px; border-radius: 8px; font-size: 11px; font-weight: 600; cursor: pointer; flex-shrink: 0; }
    .drawer-item:hover { background: #3a3a3c; }

    /* Bottom CapCut Nav Toolbar */
    .bottom-nav { height: 58px; background: #121212; border-top: 1px solid #222; display: flex; align-items: center; justify-content: space-around; padding: 0 6px; }
    .nav-tool { display: flex; flex-direction: column; align-items: center; gap: 3px; background: none; border: none; color: #999; font-size: 10px; font-weight: 600; cursor: pointer; flex: 1; }
    .nav-tool.active { color: #00f2fe; }
    .nav-tool .icon { font-size: 18px; }
  </style>
</head>
<body>

  <!-- Top App Bar -->
  <div class="top-bar">
    <div class="brand-logo">⚡ SpaceCreator Studio</div>
    <button class="btn-export" onclick="exportFile()">Export</button>
  </div>

  <!-- Video Viewport -->
  <div class="viewport" id="viewport">
    <video id="mainVideo" playsinline></video>
    <div id="overlayText"></div>

    <div class="upload-overlay" id="uploadPrompt">
      <label class="btn-upload-big">
        ➕ New Project (Upload Video)
        <input type="file" id="videoFile" accept="video/*" style="display:none;">
      </label>
    </div>
  </div>

  <!-- Playback Scrubber & Time -->
  <div class="play-control-bar">
    <span class="time-badge" id="timeCurrent">00:00</span>
    <button class="btn-play-pause" id="btnPlay" onclick="togglePlay()">▶️</button>
    <span class="time-badge" id="timeDuration">00:00</span>
  </div>

  <!-- CapCut Timeline -->
  <div class="timeline-container">
    <input type="range" class="playhead-scrubber" id="timelineScrubber" min="0" max="100" value="0">
    <div class="track-strip">
      <span>🎬 Main Video Track (Clip 1)</span>
    </div>
  </div>

  <!-- Tool Drawers (CapCut Menus) -->
  <div class="tool-drawer active" id="drawer-edit">
    <button class="drawer-item" onclick="splitVideo()">✂️ Split</button>
    <button class="drawer-item" onclick="changeSpeed(0.5)">0.5x Slow</button>
    <button class="drawer-item" onclick="changeSpeed(1.0)">1.0x Normal</button>
    <button class="drawer-item" onclick="changeSpeed(2.0)">2.0x Fast</button>
    <button class="drawer-item" onclick="rotateVideo()">🔄 Rotate 90°</button>
  </div>

  <div class="tool-drawer" id="drawer-audio">
    <button class="drawer-item" onclick="toggleMute()">🔇 Mute Video</button>
    <button class="drawer-item" onclick="adjustVolume(0.5)">🔉 50% Vol</button>
    <button class="drawer-item" onclick="adjustVolume(1.0)">🔊 100% Vol</button>
    <button class="drawer-item" onclick="playSFX()">🔔 Ding SFX</button>
  </div>

  <div class="tool-drawer" id="drawer-text">
    <button class="drawer-item" onclick="addTextPrompt('VIRAL MOMENT 🔥')">🔥 Viral Tag</button>
    <button class="drawer-item" onclick="addTextPrompt('SUBSCRIBE NOW')">🔔 Subscribe</button>
    <button class="drawer-item" onclick="addCustomText()">✏️ Custom Text</button>
    <button class="drawer-item" onclick="clearText()">🚫 Clear Text</button>
  </div>

  <div class="tool-drawer" id="drawer-filter">
    <button class="drawer-item" onclick="applyVideoFilter('none')">Original</button>
    <button class="drawer-item" onclick="applyVideoFilter('grayscale(100%)')">⬛ B&W</button>
    <button class="drawer-item" onclick="applyVideoFilter('sepia(80%)')">🎞️ Vintage</button>
    <button class="drawer-item" onclick="applyVideoFilter('contrast(160%) saturate(140%)')">✨ Cinematic</button>
  </div>

  <div class="tool-drawer" id="drawer-ratio">
    <button class="drawer-item" onclick="setAspect('16/9')">16:9 (YouTube)</button>
    <button class="drawer-item" onclick="setAspect('9/16')">9:16 (Shorts/Reel)</button>
    <button class="drawer-item" onclick="setAspect('1/1')">1:1 (Square)</button>
  </div>

  <!-- Bottom CapCut Navigation -->
  <div class="bottom-nav">
    <button class="nav-tool active" onclick="switchDrawer('edit')"><span class="icon">✂️</span>Edit</button>
    <button class="nav-tool" onclick="switchDrawer('audio')"><span class="icon">🎵</span>Audio</button>
    <button class="nav-tool" onclick="switchDrawer('text')"><span class="icon">📝</span>Text</button>
    <button class="nav-tool" onclick="switchDrawer('filter')"><span class="icon">🎨</span>Filters</button>
    <button class="nav-tool" onclick="switchDrawer('ratio')"><span class="icon">📐</span>Ratio</button>
  </div>

  <script>
    const video = document.getElementById('mainVideo');
    const scrubber = document.getElementById('timelineScrubber');
    const curTime = document.getElementById('timeCurrent');
    const durTime = document.getElementById('timeDuration');
    const playBtn = document.getElementById('btnPlay');
    const promptBox = document.getElementById('uploadPrompt');
    const overlayText = document.getElementById('overlayText');

    let videoRotation = 0;

    // File Upload
    document.getElementById('videoFile').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;
      video.src = URL.createObjectURL(file);
      promptBox.style.display = 'none';
      video.load();
      video.play();
      playBtn.innerText = '⏸️';
    });

    // Time Format Helper
    function formatTime(s) {
      const m = Math.floor(s / 60);
      const sec = Math.floor(s % 60);
      return `${m < 10 ? '0' : ''}${m}:${sec < 10 ? '0' : ''}${sec}`;
    }

    // Video Events
    video.addEventListener('loadedmetadata', function() {
      durTime.innerText = formatTime(video.duration);
      scrubber.max = Math.floor(video.duration);
    });

    video.addEventListener('timeupdate', function() {
      curTime.innerText = formatTime(video.currentTime);
      scrubber.value = Math.floor(video.currentTime);
    });

    scrubber.addEventListener('input', function() {
      video.currentTime = scrubber.value;
    });

    function togglePlay() {
      if (video.paused) {
        video.play();
        playBtn.innerText = '⏸️';
      } else {
        video.pause();
        playBtn.innerText = '▶️';
      }
    }

    // Switch CapCut Drawers
    function switchDrawer(id) {
      document.querySelectorAll('.tool-drawer').forEach(d => d.classList.remove('active'));
      document.querySelectorAll('.nav-tool').forEach(b => b.classList.remove('active'));
      document.getElementById('drawer-' + id).classList.add('active');
      event.currentTarget.classList.add('active');
    }

    // Video Edit Tools
    function changeSpeed(rate) { video.playbackRate = rate; }
    
    function rotateVideo() {
      videoRotation = (videoRotation + 90) % 360;
      video.style.transform = `rotate(${videoRotation}deg)`;
    }

    function splitVideo() {
      alert(`Clip split successfully at ${formatTime(video.currentTime)}!`);
    }

    // Audio Tools
    function toggleMute() { video.muted = !video.muted; }
    function adjustVolume(vol) { video.volume = vol; }
    function playSFX() {
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = audioCtx.createOscillator();
      osc.frequency.setValueAtTime(800, audioCtx.currentTime);
      osc.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.15);
    }

    // Text & Subtitle Tools
    function addTextPrompt(txt) {
      overlayText.innerText = txt;
    }

    function addCustomText() {
      const val = prompt("Enter text on video:");
      if (val) overlayText.innerText = val;
    }

    function clearText() { overlayText.innerText = ''; }

    // Filters & Ratio
    function applyVideoFilter(filterVal) {
      video.style.filter = filterVal;
    }

    function setAspect(ratio) {
      const vp = document.getElementById('viewport');
      if (ratio === '9/16') {
        video.style.aspectRatio = '9 / 16';
      } else if (ratio === '16/9') {
        video.style.aspectRatio = '16 / 9';
      } else {
        video.style.aspectRatio = '1 / 1';
      }
    }

    // Export Frame/Snap
    function exportFile() {
      if (!video.videoWidth) {
        alert("Please load a video first!");
        return;
      }
      const c = document.createElement('canvas');
      c.width = video.videoWidth;
      c.height = video.videoHeight;
      const ctx = c.getContext('2d');
      ctx.filter = video.style.filter || 'none';
      ctx.drawImage(video, 0, 0, c.width, c.height);

      if (overlayText.innerText) {
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 48px Poppins';
        ctx.textAlign = 'center';
        ctx.shadowColor = 'black';
        ctx.shadowBlur = 10;
        ctx.fillText(overlayText.innerText, c.width / 2, c.height - 80);
      }

      const link = document.createElement('a');
      link.download = 'spacecreator-export.png';
      link.href = c.toDataURL();
      link.click();
    }
  </script>
</body>
</html>
