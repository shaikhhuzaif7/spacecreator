<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SpaceCreator - Canva Studio Pro</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@700;900&family=Pacifico&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, -apple-system, sans-serif; display: flex; flex-direction: column; height: 100vh; background: #0b0f19; color: #fff; }
    header { background: #111827; padding: 10px 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #1f2937; }
    header h1 { font-size: 17px; font-weight: 800; color: #38bdf8; display: flex; align-items: center; gap: 6px; }
    
    .layout { display: flex; flex: 1; overflow: hidden; }
    .sidebar { width: 280px; background: #111827; border-right: 1px solid #1f2937; padding: 14px; display: flex; flex-direction: column; gap: 12px; overflow-y: auto; }
    
    .section-title { font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; color: #94a3b8; font-weight: 700; margin-top: 4px; }
    .btn-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    
    .btn { display: flex; align-items: center; justify-content: center; gap: 6px; width: 100%; padding: 8px 10px; font-size: 13px; font-weight: 600; border-radius: 6px; border: 1px solid #374151; background: #1f2937; color: #f9fafb; cursor: pointer; transition: 0.2s; }
    .btn:hover { background: #374151; }
    .btn-tpl { font-size: 11px; padding: 6px 8px; background: #1e293b; border-color: #334155; }
    
    .row { display: flex; gap: 8px; align-items: center; }
    select, input[type="color"] { background: #1f2937; color: #fff; border: 1px solid #374151; border-radius: 6px; padding: 6px 8px; font-size: 13px; width: 100%; }
    input[type="color"] { height: 36px; padding: 2px; cursor: pointer; width: 50px; }
    
    .btn-download { background: #0284c7; border: none; color: white; margin-top: auto; padding: 12px; font-size: 14px; }
    .btn-download:hover { background: #0369a1; }
    .btn-delete { background: #dc2626; border: none; color: white; }
    .btn-delete:hover { background: #b91c1c; }
    
    .workspace { flex: 1; display: flex; align-items: center; justify-content: center; background: #030712; padding: 16px; overflow: auto; }
    .canvas-container-box { border-radius: 8px; overflow: hidden; box-shadow: 0 10px 35px rgba(0,0,0,0.8); border: 1px solid #1f2937; }

    @media (max-width: 768px) {
      .layout { flex-direction: column; }
      .sidebar { width: 100%; max-height: 230px; }
    }
  </style>
</head>
<body>

  <header>
    <h1>🚀 SpaceCreator Studio</h1>
    <span style="font-size: 12px; color: #38bdf8; font-weight: 600;">Pro Editor</span>
  </header>

  <div class="layout">
    <aside class="sidebar">
      
      <!-- Templates -->
      <div class="section-title">✨ Templates</div>
      <div class="btn-grid">
        <button class="btn btn-tpl" onclick="loadYTTemplate()">🔴 YT Thumbnail</button>
        <button class="btn btn-tpl" onclick="loadInstaTemplate()">📸 Insta Post</button>
      </div>

      <!-- Add Tools -->
      <div class="section-title">🛠️ Elements</div>
      <div class="btn-grid">
        <button class="btn" onclick="addText()">✏️ Add Text</button>
        <button class="btn" onclick="addShape()">⬛ Add Box</button>
      </div>
      
      <label class="btn" style="cursor: pointer;">
        🖼️ Upload Photo
        <input type="file" id="uploadImg" accept="image/*" style="display:none;">
      </label>

      <!-- Font & Colors -->
      <div class="section-title">🎨 Styling</div>
      <div class="row">
        <select id="fontSelect" onchange="changeFont(this.value)">
          <option value="sans-serif">Default Font</option>
          <option value="Bebas Neue">Bebas Neue (Gaming/YT)</option>
          <option value="Montserrat">Montserrat (Bold Modern)</option>
          <option value="Pacifico">Pacifico (Stylish/Cursive)</option>
          <option value="Roboto">Roboto (Clean)</option>
          <option value="Impact">Impact (Meme/Bold)</option>
        </select>
        <input type="color" id="colorPicker" value="#ffffff" title="Pick Color" onchange="changeColor(this.value)">
      </div>

      <!-- Action Buttons -->
      <div class="section-title">⚙️ Actions</div>
      <button class="btn btn-delete" onclick="deleteActive()">🗑️ Delete Element</button>
      <button class="btn btn-download" onclick="saveDesign()">⬇️ Download High-Res PNG</button>
    </aside>

    <main class="workspace">
      <div class="canvas-container-box">
        <canvas id="mainCanvas" width="640" height="360"></canvas>
      </div>
    </main>
  </div>

  <script>
    const canvas = new fabric.Canvas('mainCanvas', {
      backgroundColor: '#1e293b'
    });

    // 1. Add Text
    function addText(customText = 'Double Click to Edit', color = '#ffffff', font = 'Bebas Neue', size = 38) {
      const text = new fabric.IText(customText, {
        left: 80,
        top: 80,
        fill: color,
        fontSize: size,
        fontFamily: font
      });
      canvas.add(text);
      canvas.setActiveObject(text);
    }

    // 2. Add Shape
    function addShape(color = '#38bdf8') {
      const rect = new fabric.Rect({
        left: 120,
        top: 100,
        width: 140,
        height: 90,
        fill: color,
        rx: 8,
        ry: 8
      });
      canvas.add(rect);
      canvas.setActiveObject(rect);
    }

    // 3. Change Font
    function changeFont(fontFamily) {
      const active = canvas.getActiveObject();
      if (active && active.type === 'i-text') {
        active.set('fontFamily', fontFamily);
        canvas.renderAll();
      }
    }

    // 4. Change Color
    function changeColor(hexColor) {
      const active = canvas.getActiveObject();
      if (active) {
        active.set('fill', hexColor);
        canvas.renderAll();
      }
    }

    // 5. Image Upload
    document.getElementById('uploadImg').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(evt) {
        const img = new Image();
        img.src = evt.target.result;
        img.onload = function() {
          const fabricImg = new fabric.Image(img);
          fabricImg.scaleToWidth(260);
          canvas.centerObject(fabricImg);
          canvas.add(fabricImg);
          canvas.renderAll();
        };
      };
      reader.readAsDataURL(file);
    });

    // 6. Delete
    function deleteActive() {
      const item = canvas.getActiveObject();
      if (item) canvas.remove(item);
    }

    // 7. Templates
    function loadYTTemplate() {
      canvas.clear();
      canvas.setBackgroundColor('#0f172a', canvas.renderAll.bind(canvas));
      
      const badge = new fabric.Rect({
        left: 50,
        top: 50,
        width: 160,
        height: 44,
        fill: '#ef4444',
        rx: 6,
        ry: 6
      });
      canvas.add(badge);

      const tag = new fabric.IText('VIRAL LIVE', {
        left: 65,
        top: 56,
        fill: '#ffffff',
        fontSize: 26,
        fontFamily: 'Bebas Neue'
      });
      canvas.add(tag);

      const title = new fabric.IText('TOP SECRET TRICK', {
        left: 50,
        top: 110,
        fill: '#facc15',
        fontSize: 48,
        fontFamily: 'Bebas Neue'
      });
      canvas.add(title);
    }

    function loadInstaTemplate() {
      canvas.clear();
      canvas.setBackgroundColor('#f8fafc', canvas.renderAll.bind(canvas));

      const card = new fabric.Rect({
        left: 60,
        top: 40,
        width: 520,
        height: 280,
        fill: '#3b82f6',
        rx: 16,
        ry: 16
      });
      canvas.add(card);

      const headline = new fabric.IText('NEW LAUNCH 🚀', {
        left: 100,
        top: 90,
        fill: '#ffffff',
        fontSize: 42,
        fontFamily: 'Montserrat'
      });
      canvas.add(headline);

      const sub = new fabric.IText('Special Discount Available Today', {
        left: 100,
        top: 160,
        fill: '#e2e8f0',
        fontSize: 20,
        fontFamily: 'Roboto'
      });
      canvas.add(sub);
    }

    // 8. Download PNG
    function saveDesign() {
      const link = document.createElement('a');
      link.download = 'spacecreator-pro.png';
      link.href = canvas.toDataURL({ format: 'png', quality: 1.0, multiplier: 2 });
      link.click();
    }
  </script>
</body>
</html>
