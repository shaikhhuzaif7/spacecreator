
<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SpaceCreator - Ultimate Photo & Video Studio</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@700;900&family=Poppins:wght@400;600;700&family=Pacifico&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
    body { background: #0f172a; color: #f8fafc; display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

    /* Header */
    header { background: #1e293b; padding: 10px 16px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #334155; }
    .brand { font-size: 18px; font-weight: 800; color: #38bdf8; display: flex; align-items: center; gap: 8px; }
    .header-btns { display: flex; gap: 8px; }
    .btn-top { border: none; padding: 7px 14px; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; }
    .btn-save { background: #0284c7; color: white; }

    /* Studio Layout */
    .studio-container { display: flex; flex: 1; overflow: hidden; }
    
    /* Sidebar Navigation */
    .nav-tabs { width: 75px; background: #090d16; border-right: 1px solid #1e293b; display: flex; flex-direction: column; align-items: center; padding: 12px 0; gap: 16px; }
    .tab-btn { background: none; border: none; color: #94a3b8; font-size: 10px; display: flex; flex-direction: column; align-items: center; gap: 4px; cursor: pointer; width: 100%; }
    .tab-btn.active { color: #38bdf8; font-weight: 700; }
    .tab-btn span { font-size: 20px; }

    /* Controls Panel */
    .panel { width: 270px; background: #1e293b; border-right: 1px solid #334155; padding: 14px; overflow-y: auto; display: flex; flex-direction: column; gap: 14px; }
    .panel-group { display: none; flex-direction: column; gap: 10px; }
    .panel-group.active { display: flex; }
    .panel-title { font-size: 12px; font-weight: 700; text-transform: uppercase; color: #94a3b8; letter-spacing: 0.05em; }

    .btn-action { background: #334155; color: white; border: 1px solid #475569; padding: 8px 12px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; text-align: center; }
    .btn-action:hover { background: #475569; }
    .slider-box { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: #cbd5e1; }
    .slider-box input { accent-color: #38bdf8; }

    /* Workspace */
    .workspace { flex: 1; display: flex; align-items: center; justify-content: center; background: #020617; position: relative; overflow: auto; padding: 16px; }
    .canvas-card { border-radius: 8px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.8); border: 1px solid #334155; }
    
    /* Video Box */
    #videoContainer { display: none; flex-direction: column; align-items: center; gap: 10px; max-width: 90%; }
    video { max-width: 100%; max-height: 55vh; border-radius: 8px; background: black; }

    @media (max-width: 768px) {
      .studio-container { flex-direction: column; }
      .nav-tabs { width: 100%; height: 55px; flex-direction: row; justify-content: space-around; padding: 4px; border-right: none; border-bottom: 1px solid #1e293b; }
      .panel { width: 100%; max-height: 180px; }
      .workspace { padding: 8px; }
    }
  </style>
</head>
<body>

  <!-- Top Header -->
  <header>
    <div class="brand">🚀 SpaceCreator Studio</div>
    <div class="header-btns">
      <button class="btn-top btn-save" onclick="exportCanvas()">⬇️ Export PNG</button>
    </div>
  </header>

  <div class="studio-container">
    <!-- Nav Tabs -->
    <div class="nav-tabs">
      <button class="tab-btn active" onclick="switchTab('design')"><span>🎨</span>Design</button>
      <button class="tab-btn" onclick="switchTab('adjust')"><span>✨</span>Filters</button>
      <button class="tab-btn" onclick="switchTab('brush')"><span>🖌️</span>Brush</button>
      <button class="tab-btn" onclick="switchTab('video')"><span>🎬</span>Video</button>
    </div>

    <!-- Controls Panel -->
    <div class="panel">
      <!-- 1. Design Panel -->
      <div id="tab-design" class="panel-group active">
        <div class="panel-title">Elements & Layers</div>
        <button class="btn-action" onclick="addText()">✏️ Add Text</button>
        <button class="btn-action" onclick="addBox()">⬛ Add Box</button>
        <label class="btn-action" style="cursor: pointer;">
          🖼️ Upload Photo
          <input type="file" id="imgLoader" accept="image/*" style="display:none;">
        </label>
        
        <div class="panel-title" style="margin-top:8px;">Font & Color</div>
        <select id="fontSelect" class="btn-action" onchange="setFont(this.value)">
          <option value="Poppins">Poppins</option>
          <option value="Bebas Neue">Bebas Neue (Viral/Gaming)</option>
          <option value="Montserrat">Montserrat (Bold)</option>
          <option value="Pacifico">Pacifico (Cursive)</option>
        </select>
        <input type="color" id="colorPicker" value="#ffffff" onchange="setColor(this.value)" style="width:100%; height:36px; background:#334155; border:none; border-radius:6px; cursor:pointer;">
        
        <button class="btn-action" style="background:#dc2626; border:none; margin-top:8px;" onclick="deleteSelected()">🗑️ Delete Element</button>
      </div>

      <!-- 2. Filters / Adjustment Panel -->
      <div id="tab-adjust" class="panel-group">
        <div class="panel-title">Color Grading</div>
        <div class="slider-box">
          <span>Brightness</span>
          <input type="range" min="-1" max="1" step="0.05" value="0" oninput="applyFilter('brightness', this.value)">
        </div>
        <div class="slider-box">
          <span>Contrast</span>
          <input type="range" min="-1" max="1" step="0.05" value="0" oninput="applyFilter('contrast', this.value)">
        </div>
        <div class="slider-box">
          <span>Saturation</span>
          <input type="range" min="-1" max="1" step="0.05" value="0" oninput="applyFilter('saturation', this.value)">
        </div>
        <button class="btn-action" onclick="applyQuickFilter('vintage')">🎞️ Vintage Filter</button>
        <button class="btn-action" onclick="applyQuickFilter('bw')">⬛ Black & White</button>
      </div>

      <!-- 3. Brush / Masking Panel -->
      <div id="tab-brush" class="panel-group">
        <div class="panel-title">Magic Brush Tool</div>
        <button class="btn-action" id="brushToggleBtn" onclick="toggleDrawingMode()">🖌️ Draw / Brush ON</button>
        <div class="slider-box">
          <span>Brush Size:</span>
          <input type="range" min="5" max="60" value="18" oninput="setBrushWidth(this.value)">
        </div>
        <div class="slider-box">
          <span>Brush Color:</span>
          <input type="color" value="#a855f7" onchange="setBrushColor(this.value)" style="width:100%; height:34px; background:#334155; border:none; border-radius:6px;">
        </div>
      </div>

      <!-- 4. Video Panel -->
      <div id="tab-video" class="panel-group">
        <div class="panel-title">Video Timeline & Cut</div>
        <label class="btn-action" style="cursor: pointer; background:#7c3aed;">
          🎥 Upload MP4 Video
          <input type="file" id="videoLoader" accept="video/*" style="display:none;">
        </label>
        <button class="btn-action" onclick="toggleVideoPlay()">▶️ Play / Pause</button>
        <button class="btn-action" onclick="captureVideoFrame()">📸 Grab Frame To Canvas</button>
      </div>
    </div>

    <!-- Main Workspace -->
    <div class="workspace">
      <!-- Fabric Canvas -->
      <div class="canvas-card" id="canvasCard">
        <canvas id="studioCanvas" width="640" height="360"></canvas>
      </div>

      <!-- Video View -->
      <div id="videoContainer">
        <video id="videoPlayer" controls></video>
      </div>
    </div>
  </div>

  <script>
    const canvas = new fabric.Canvas('studioCanvas', {
      backgroundColor: '#1e293b'
    });

    // Switch Tabs
    function switchTab(tabId) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.panel-group').forEach(p => p.classList.remove('active'));
      
      const btn = event.currentTarget;
      if (btn) btn.classList.add('active');
      document.getElementById('tab-' + tabId).classList.add('active');

      if (tabId === 'video') {
        document.getElementById('canvasCard').style.display = 'none';
        document.getElementById('videoContainer').style.display = 'flex';
      } else {
        document.getElementById('canvasCard').style.display = 'block';
        document.getElementById('videoContainer').style.display = 'none';
      }
    }

    // Design Actions
    function addText() {
      const t = new fabric.IText('Edit Text Here', { left: 80, top: 80, fill: '#ffffff', fontSize: 36, fontFamily: 'Poppins' });
      canvas.add(t);
      canvas.setActiveObject(t);
    }

    function addBox() {
      const r = new fabric.Rect({ left: 100, top: 100, width: 140, height: 90, fill: '#38bdf8', rx: 8, ry: 8 });
      canvas.add(r);
      canvas.setActiveObject(r);
    }

    function setFont(f) {
      const act = canvas.getActiveObject();
      if (act && act.type === 'i-text') { act.set('fontFamily', f); canvas.renderAll(); }
    }

    function setColor(c) {
      const act = canvas.getActiveObject();
      if (act) { act.set('fill', c); canvas.renderAll(); }
    }

    function deleteSelected() {
      const act = canvas.getActiveObject();
      if (act) canvas.remove(act);
    }

    // Upload Photo
    document.getElementById('imgLoader').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(evt) {
        fabric.Image.fromURL(evt.target.result, function(img) {
          img.scaleToWidth(300);
          canvas.centerObject(img);
          canvas.add(img);
          canvas.setActiveObject(img);
          canvas.renderAll();
        });
      };
      reader.readAsDataURL(file);
    });

    // Brush Tool
    function toggleDrawingMode() {
      canvas.isDrawingMode = !canvas.isDrawingMode;
      const b = document.getElementById('brushToggleBtn');
      if (canvas.isDrawingMode) {
        b.innerText = '🛑 Brush OFF';
        b.style.background = '#ef4444';
        canvas.freeDrawingBrush.color = '#a855f7';
        canvas.freeDrawingBrush.width = 18;
      } else {
        b.innerText = '🖌️ Draw / Brush ON';
        b.style.background = '#334155';
      }
    }

    function setBrushWidth(w) {
      if (canvas.freeDrawingBrush) canvas.freeDrawingBrush.width = parseInt(w);
    }

    function setBrushColor(c) {
      if (canvas.freeDrawingBrush) canvas.freeDrawingBrush.color = c;
    }

    // Color Grading / Filters
    function applyFilter(type, val) {
      const act = canvas.getActiveObject();
      if (!act || act.type !== 'image') return;
      val = parseFloat(val);

      if (type === 'brightness') {
        act.filters[0] = new fabric.Image.filters.Brightness({ brightness: val });
      } else if (type === 'contrast') {
        act.filters[1] = new fabric.Image.filters.Contrast({ contrast: val });
      } else if (type === 'saturation') {
        act.filters[2] = new fabric.Image.filters.Saturation({ saturation: val });
      }
      act.applyFilters();
      canvas.renderAll();
    }

    function applyQuickFilter(type) {
      const act = canvas.getActiveObject();
      if (!act || act.type !== 'image') return;
      if (type === 'bw') {
        act.filters[3] = new fabric.Image.filters.Grayscale();
      } else if (type === 'vintage') {
        act.filters[3] = new fabric.Image.filters.Sepia();
      }
      act.applyFilters();
      canvas.renderAll();
    }

    // Video Functions
    const vid = document.getElementById('videoPlayer');
    document.getElementById('videoLoader').addEventListener('change', function(e) {
      const f = e.target.files[0];
      if (!f) return;
      vid.src = URL.createObjectURL(f);
      vid.load();
    });

    function toggleVideoPlay() {
      if (vid.paused) vid.play(); else vid.pause();
    }

    function captureVideoFrame() {
      if (!vid.videoWidth) return;
      const tempC = document.createElement('canvas');
      tempC.width = vid.videoWidth;
      tempC.height = vid.videoHeight;
      const tempCtx = tempC.getContext('2d');
      tempCtx.drawImage(vid, 0, 0, tempC.width, tempC.height);
      const dataUrl = tempC.toDataURL();

      fabric.Image.fromURL(dataUrl, function(img) {
        img.scaleToWidth(320);
        canvas.centerObject(img);
        canvas.add(img);
        switchTab('design');
      });
    }

    // Export
    function exportCanvas() {
      const link = document.createElement('a');
      link.download = 'spacecreator-studio.png';
      link.href = canvas.toDataURL({ format: 'png', quality: 1.0, multiplier: 2 });
      link.click();
    }
  </script>
</body>
</html>
