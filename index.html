
<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SpaceCreator - Photo Studio</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Poppins', sans-serif; background: #f8fafc; color: #1e293b; user-select: none; }

    /* Home View */
    #homeScreen { min-height: 100vh; display: flex; flex-direction: column; }
    .top-nav { background: #fff; padding: 12px 18px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #e2e8f0; }
    .brand-title { font-size: 19px; font-weight: 800; color: #7c3aed; }
    
    .hero-banner { background: linear-gradient(135deg, #8b5cf6, #ec4899); margin: 14px; border-radius: 18px; padding: 26px 18px; color: white; text-align: center; }
    .hero-banner h2 { font-size: 21px; margin-bottom: 10px; font-weight: 700; }
    .search-mock { background: white; border-radius: 25px; padding: 8px 14px; display: flex; align-items: center; gap: 8px; color: #94a3b8; font-size: 13px; max-width: 400px; margin: 0 auto; }
    
    .sec-title { font-size: 15px; font-weight: 700; padding: 12px 18px 6px; }
    .action-row { display: flex; gap: 12px; padding: 8px 18px; overflow-x: auto; }
    .action-card { background: white; border: 1px solid #e2e8f0; border-radius: 12px; padding: 14px; min-width: 130px; text-align: center; cursor: pointer; }
    .action-icon { font-size: 26px; margin-bottom: 6px; }
    .action-name { font-size: 12px; font-weight: 600; }

    /* Photo Editor Screen */
    #editorScreen { display: none; flex-direction: column; height: 100vh; background: #0b0f19; }
    .editor-header { background: #1e293b; padding: 10px 14px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; }
    .btn-hdr { border: none; padding: 7px 12px; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; }
    .btn-back { background: #334155; color: white; }
    .btn-save { background: #7c3aed; color: white; }

    .canvas-viewport { flex: 1; display: flex; justify-content: center; align-items: center; overflow: hidden; position: relative; background: #020617; }
    #imageCanvas { max-width: 95%; max-height: 95%; border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.7); touch-action: none; }

    /* Bottom Control Bar */
    .bottom-bar { background: #1e293b; border-top: 1px solid #334155; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px; }
    .tool-selector { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
    .btn-tool { background: #334155; color: white; border: 1px solid #475569; padding: 6px 12px; border-radius: 20px; font-size: 12px; white-space: nowrap; cursor: pointer; display: flex; align-items: center; gap: 4px; }
    .btn-tool.active { background: #7c3aed; border-color: #a78bfa; font-weight: 600; }
    
    .brush-controls { display: flex; align-items: center; gap: 10px; color: #94a3b8; font-size: 12px; }
    .brush-slider { flex: 1; accent-color: #a855f7; }
  </style>
</head>
<body>

  <!-- 1. HOME SCREEN -->
  <div id="homeScreen">
    <div class="top-nav">
      <div class="brand-title">🚀 SpaceCreator</div>
      <label class="btn-hdr btn-save" style="cursor: pointer;">
        + Edit Photo
        <input type="file" id="fileUploadHome" accept="image/*" style="display: none;">
      </label>
    </div>

    <div class="hero-banner">
      <h2>What will you design today?</h2>
      <div class="search-mock">🔍 Search photo tools, templates...</div>
    </div>

    <div class="sec-title">Quick Actions</div>
    <div class="action-row">
      <label class="action-card" style="cursor: pointer;">
        <div class="action-icon">🪄</div>
        <div class="action-name">Magic Brush</div>
        <input type="file" class="hidden-upload" accept="image/*" style="display: none;">
      </label>
      <label class="action-card" style="cursor: pointer;">
        <div class="action-icon">🖼️</div>
        <div class="action-name">Photo Filter</div>
        <input type="file" class="hidden-upload" accept="image/*" style="display: none;">
      </label>
      <label class="action-card" style="cursor: pointer;">
        <div class="action-icon">🧹</div>
        <div class="action-name">Erase / Clean</div>
        <input type="file" class="hidden-upload" accept="image/*" style="display: none;">
      </label>
    </div>

    <div class="sec-title">Sample Photos to Edit</div>
    <div class="action-row">
      <div class="action-card" onclick="loadSample('model')">
        <div class="action-icon">👗</div>
        <div class="action-name">Fashion Model</div>
      </div>
      <div class="action-card" onclick="loadSample('car')">
        <div class="action-icon">🏎️</div>
        <div class="action-name">Sports Car</div>
      </div>
    </div>
  </div>

  <!-- 2. IN-APP PHOTO EDITOR SCREEN -->
  <div id="editorScreen">
    <div class="editor-header">
      <button class="btn-hdr btn-back" onclick="exitToHome()">⬅️ Home</button>
      <span style="font-size: 13px; font-weight: 700; color: #a78bfa;">Brush Editor</span>
      <button class="btn-hdr btn-save" onclick="downloadImage()">⬇️ Download</button>
    </div>

    <div class="canvas-viewport">
      <canvas id="imageCanvas"></canvas>
    </div>

    <div class="bottom-bar">
      <!-- Brush size slider -->
      <div class="brush-controls">
        <span>Brush Size:</span>
        <input type="range" id="brushSize" class="brush-slider" min="5" max="80" value="25">
        <span id="sizeVal">25px</span>
      </div>

      <!-- Tools -->
      <div class="tool-selector">
        <button class="btn-tool active" id="btnBrush" onclick="setMode('brush')">🟣 Magic Paint</button>
        <button class="btn-tool" id="btnErase" onclick="setMode('eraser')">🧽 Clear Marks</button>
        <button class="btn-tool" onclick="applyEffect('vintage')">🎞️ Vintage</button>
        <button class="btn-tool" onclick="applyEffect('bw')">⬛ B&W</button>
        <button class="btn-tool" onclick="applyEffect('bright')">☀️ Bright</button>
        <button class="btn-tool" onclick="applyEffect('reset')">🔄 Reset Photo</button>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('imageCanvas');
    const ctx = canvas.getContext('2d');
    let loadedImage = new Image();
    let originalImageData = null;
    let isDrawing = false;
    let currentMode = 'brush'; // 'brush' or 'eraser'
    let brushRadius = 25;

    // Handle Uploads
    function attachUploadHandlers() {
      const inputs = [document.getElementById('fileUploadHome'), ...document.querySelectorAll('.hidden-upload')];
      inputs.forEach(input => {
        input.addEventListener('change', function(e) {
          const file = e.target.files[0];
          if (!file) return;
          const reader = new FileReader();
          reader.onload = function(evt) {
            initEditorWithImage(evt.target.result);
          };
          reader.readAsDataURL(file);
        });
      });
    }
    attachUploadHandlers();

    // Sample Images
    function loadSample(type) {
      if (type === 'model') {
        initEditorWithImage('https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?w=800&auto=format&fit=crop&q=80');
      } else {
        initEditorWithImage('https://images.unsplash.com/photo-1617814076367-b759c7d7e738?w=800&auto=format&fit=crop&q=80');
      }
    }

    function initEditorWithImage(src) {
      document.getElementById('homeScreen').style.display = 'none';
      document.getElementById('editorScreen').style.display = 'flex';

      loadedImage.crossOrigin = "anonymous";
      loadedImage.src = src;
      loadedImage.onload = function() {
        const maxWidth = Math.min(window.innerWidth - 30, 720);
        const maxHeight = window.innerHeight * 0.65;
        let w = loadedImage.width;
        let h = loadedImage.height;

        const ratio = Math.min(maxWidth / w, maxHeight / h, 1);
        canvas.width = w * ratio;
        canvas.height = h * ratio;

        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(loadedImage, 0, 0, canvas.width, canvas.height);
        originalImageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      };
    }

    function exitToHome() {
      document.getElementById('editorScreen').style.display = 'none';
      document.getElementById('homeScreen').style.display = 'flex';
    }

    // Brush Tool Logic
    function getPos(e) {
      const rect = canvas.getBoundingClientRect();
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return {
        x: (clientX - rect.left) * (canvas.width / rect.width),
        y: (clientY - rect.top) * (canvas.height / rect.height)
      };
    }

    function startPaint(e) {
      isDrawing = true;
      paint(e);
    }

    function stopPaint() {
      isDrawing = false;
      ctx.beginPath();
    }

    function paint(e) {
      if (!isDrawing) return;
      e.preventDefault();
      const pos = getPos(e);

      ctx.lineWidth = brushRadius * 2;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      if (currentMode === 'brush') {
        ctx.strokeStyle = 'rgba(168, 85, 247, 0.65)'; // Purple semi-transparent Canva brush
        ctx.lineTo(pos.x, pos.y);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(pos.x, pos.y);
      } else if (currentMode === 'eraser') {
        // Redraw clean original section under eraser
        if (originalImageData) {
          ctx.putImageData(originalImageData, 0, 0);
        }
      }
    }

    canvas.addEventListener('mousedown', startPaint);
    canvas.addEventListener('mousemove', paint);
    canvas.addEventListener('mouseup', stopPaint);

    canvas.addEventListener('touchstart', startPaint, { passive: false });
    canvas.addEventListener('touchmove', paint, { passive: false });
    canvas.addEventListener('touchend', stopPaint);

    // Slider
    document.getElementById('brushSize').addEventListener('input', function(e) {
      brushRadius = parseInt(e.target.value);
      document.getElementById('sizeVal').innerText = brushRadius + 'px';
    });

    function setMode(mode) {
      currentMode = mode;
      document.getElementById('btnBrush').classList.toggle('active', mode === 'brush');
      document.getElementById('btnErase').classList.toggle('active', mode === 'eraser');
      if (mode === 'eraser' && originalImageData) {
        ctx.putImageData(originalImageData, 0, 0);
      }
    }

    // Filters
    function applyEffect(effect) {
      if (!originalImageData) return;
      ctx.putImageData(originalImageData, 0, 0);
      let imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
      let data = imgData.data;

      if (effect === 'bw') {
        for (let i = 0; i < data.length; i += 4) {
          let avg = 0.3 * data[i] + 0.59 * data[i+1] + 0.11 * data[i+2];
          data[i] = data[i+1] = data[i+2] = avg;
        }
        ctx.putImageData(imgData, 0, 0);
      } else if (effect === 'vintage') {
        for (let i = 0; i < data.length; i += 4) {
          data[i] = data[i] * 1.15;
          data[i+2] = data[i+2] * 0.8;
        }
        ctx.putImageData(imgData, 0, 0);
      } else if (effect === 'bright') {
        for (let i = 0; i < data.length; i += 4) {
          data[i] = Math.min(255, data[i] + 30);
          data[i+1] = Math.min(255, data[i+1] + 30);
          data[i+2] = Math.min(255, data[i+2] + 30);
        }
        ctx.putImageData(imgData, 0, 0);
      }
    }

    function downloadImage() {
      const link = document.createElement('a');
      link.download = 'spacecreator-edited.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    }
  </script>
</body>
</html>
